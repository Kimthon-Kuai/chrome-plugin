<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Translator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>AI Translator</h1>
          <p class="subtitle">全页 · 划词 · 总结</p>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="card" aria-labelledby="cfg-title">
        <h2 id="cfg-title">API 配置</h2>
        <label class="field">
          <span>API Key</span>
          <input
            id="apiKey"
            type="password"
            autocomplete="off"
            placeholder="sk-..."
            spellcheck="false"
          />
        </label>
        <label class="field">
          <span>Base URL</span>
          <input
            id="baseUrl"
            type="url"
            placeholder="https://api.deepseek.com"
            spellcheck="false"
          />
        </label>
        <label class="field">
          <span>模型</span>
          <input
            id="model"
            type="text"
            placeholder="deepseek-v4-flash"
            spellcheck="false"
          />
        </label>
        <label class="field">
          <span>翻译方向</span>
          <select id="direction">
            <option value="auto">自动检测</option>
            <option value="zh2en">中文 → 英文</option>
            <option value="en2zh">英文 → 中文</option>
          </select>
        </label>
        <button id="saveBtn" class="btn primary" type="button">保存设置</button>
        <p id="saveStatus" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="card" aria-labelledby="act-title">
        <h2 id="act-title">当前页面</h2>
        <div class="actions">
          <button id="translatePageBtn" class="btn" type="button">
            全页翻译
          </button>
          <button id="restorePageBtn" class="btn ghost" type="button">
            还原原文
          </button>
          <button id="summarizeBtn" class="btn" type="button">网页总结</button>
        </div>
        <p id="actionStatus" class="status" role="status" aria-live="polite"></p>
        <p class="hint">划词翻译：在网页中选中文字即可自动翻译。</p>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
