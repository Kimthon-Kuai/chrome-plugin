<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Translator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>AI Translator</h1>
          <p class="subtitle">全页 · 划词 · 总结</p>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="card" aria-labelledby="quick-title">
        <h2 id="quick-title">快捷语言</h2>
        <div class="lang-row">
          <label class="field compact">
            <span>源语言</span>
            <select id="sourceLang">
              <option value="auto">自动</option>
              <option value="zh">中文</option>
              <option value="en">英文</option>
            </select>
          </label>
          <button id="swapLangBtn" class="btn ghost icon-btn" type="button" title="互换">⇄</button>
          <label class="field compact">
            <span>目标语言</span>
            <select id="targetLang">
              <option value="auto">自动</option>
              <option value="zh">中文</option>
              <option value="en">英文</option>
            </select>
          </label>
        </div>
        <button id="saveLangBtn" class="btn primary" type="button">保存语言</button>
        <p id="saveStatus" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="card" aria-labelledby="act-title">
        <h2 id="act-title">当前页面</h2>
        <div class="field compact mode-field">
          <span>翻译方式</span>
          <select id="pageMode">
            <option value="overwrite">覆盖翻译（仅显示译文）</option>
            <option value="bilingual">双语对照（保留原文）</option>
          </select>
        </div>
        <div class="actions">
          <button id="translatePageBtn" class="btn" type="button">全页翻译</button>
          <button id="restorePageBtn" class="btn ghost" type="button">还原原文</button>
          <button id="summarizeBtn" class="btn" type="button">网页总结</button>
        </div>
        <p id="actionStatus" class="status" role="status" aria-live="polite"></p>
        <p class="hint">划词翻译：在网页中选中文字即可自动翻译。对照模式下选区会同时包含译文，可点「翻译原文」或按 Esc 关闭浮层。</p>
      </section>

      <section class="card compact-card">
        <button id="openPanelBtn" class="btn primary" type="button">打开管理面板</button>
        <p class="hint">配置 API、查看历史与 Token 消耗。</p>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
